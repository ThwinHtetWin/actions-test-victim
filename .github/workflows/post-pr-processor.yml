name: Post-PR Processor
on:
  workflow_run:
    workflows: ["PR Check"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  process:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Workflow run context
        run: |
          echo "Triggered by: ${{ github.event.workflow_run.name }}"
          echo "Triggering actor: ${{ github.event.workflow_run.actor.login }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Head repo: ${{ github.event.workflow_run.head_repository.full_name }}"
          echo "Event: ${{ github.event.workflow_run.event }}"
      - name: Download artifacts from triggering run
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            console.log('Artifacts from triggering run:', JSON.stringify(artifacts.data, null, 2));
      - name: Check secret in workflow_run context
        env:
          HAS_SECRET: ${{ secrets.VICTIM_SECRET != '' }}
        run: |
          echo "Secret available in workflow_run context: $HAS_SECRET"
