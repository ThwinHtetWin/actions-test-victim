name: PR Check
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Head ref: ${{ github.head_ref }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "PR head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Token permissions: ${{ toJSON(github.token) }}"
      - name: Test token scope
        run: |
          # Can this token create issues on the base repo?
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{"title":"test-from-fork-pr","body":"should-fail"}')
          echo "Create issue attempt: $HTTP_CODE"
          cat /tmp/resp.json | head -5
          # Can this token read secrets?
          HTTP_CODE2=$(curl -s -o /tmp/resp2.json -w "%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets")
          echo "Read secrets attempt: $HTTP_CODE2"
