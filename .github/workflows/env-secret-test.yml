name: Env Secret Test
on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  env-test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check env secret
        env:
          HAS_PROD_SECRET: ${{ secrets.PROD_SECRET != '' }}
          HAS_VICTIM_SECRET: ${{ secrets.VICTIM_SECRET != '' }}
        run: |
          echo "Environment: production"
          echo "PROD_SECRET available: $HAS_PROD_SECRET"
          echo "VICTIM_SECRET available: $HAS_VICTIM_SECRET"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Head repo: ${{ github.event.pull_request.head.repo.full_name }}"
